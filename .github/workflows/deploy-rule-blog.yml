name: Deploy rule blog

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'skills/healico-rule-author/**'
      - '.github/workflows/deploy-rule-blog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare downloadable skill
        run: |
          mkdir -p site/downloads/healico-rule-author
          cp skills/healico-rule-author/SKILL.md site/downloads/healico-rule-author/SKILL.md

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
